<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GenZ University SRMS</title>
    <link rel="icon" type="image/png" href="../assets/images/bec_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <script src="/api/config.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            font-family: 'Poppins', sans-serif;
        }
        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .auth-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 50%;
        }
        .auth-title {
            color: #1e3a8a;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 20px 0;
        }
        .auth-form {
            text-align: left;
        }
        .auth-form .form-group {
            margin-bottom: 16px;
        }
        .auth-form label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .auth-form .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #0f172a;
            background: #f8fafc;
            transition: all 0.2s ease;
        }
        .auth-form .form-input:focus {
            outline: none;
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        input::-ms-reveal,
        input::-ms-clear {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        .auth-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .auth-links a {
            color: #2563eb;
            font-weight: 500;
            text-decoration: none;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        #error-msg {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        #auth-loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-out forwards;
        }
        .loading-dialog {
            background: white;
            padding: 24px 32px;
            border-radius: 14px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 240px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .loading-ring {
            width: 38px;
            height: 38px;
            border: 3.5px solid #e2e8f0;
            border-top-color: #1e3a8a;
            border-right-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.75s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 18px;
            }
            .auth-title {
                font-size: 1.3rem;
            }
        }
    </style>
    <script src="../js/utils/errorHandler.js"></script>
</head>
<body>
    <div class="auth-card">
        <img src="../assets/images/bec_logo.jpeg" alt="BEC Logo" class="auth-logo">
        <h2 class="auth-title">Student Login</h2>
        
        <div id="error-msg"></div>

        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-input" style="padding-right: 42px;" required>
                    <button type="button" class="toggle-password-btn" data-target="password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b; padding: 4px; display: flex; align-items: center; justify-content: center;" aria-label="Toggle password visibility">
                        <svg class="eye-icon-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon-on" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1 -4.24 -4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="remember-me" checked>
                <label for="remember-me" style="margin:0; font-weight: 400; font-size: 0.9rem;">Remember Me</label>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);" id="submit-btn">Login</button>
        </form>
        
        <div style="margin: 15px 0; display: flex; align-items: center; justify-content: center;">
            <div style="flex-grow: 1; height: 1px; background-color: #ddd;"></div>
            <span style="padding: 0 10px; color: #888; font-size: 0.9rem;">OR</span>
            <div style="flex-grow: 1; height: 1px; background-color: #ddd;"></div>
        </div>

        <button id="google-login-btn" class="btn" style="width: 100%; background-color: white; border: 1px solid #ddd; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" style="width: 18px; height: 18px;">
            Sign in with Google
        </button>
        
        <div class="auth-links">
            <a href="forgot-password.html">Forgot Password?</a>
            <a href="register.html">Create an Account</a>
        </div>

        <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.76rem; color: #64748b;">
            <span>Designed & Developed by</span>
            <a href="https://www.ayushtechnologies.in/" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 4px; background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; padding: 2px 9px; border-radius: 9999px; font-size: 0.74rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease;" onmouseover="this.style.background='#dbeafe'; this.style.color='#1d4ed8';" onmouseout="this.style.background='#eff6ff'; this.style.color='#2563eb;'">
                <span>✨</span>
                <span>Ayush Technologies</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </a>
        </div>
    </div>

    <!-- Login Loading Overlay -->
    <div id="auth-loading-overlay">
        <div class="loading-dialog">
            <div class="loading-ring"></div>
            <div style="font-weight: 700; font-size: 1rem; color: #1e3a8a; margin-top: 4px;">Logging in...</div>
            <div style="font-size: 0.82rem; color: #64748b;">Verifying credentials & loading profile</div>
        </div>
    </div>

    <script type="module" src="../js/auth/login.js?v=1.0.7"></script>
</body>
</html>
