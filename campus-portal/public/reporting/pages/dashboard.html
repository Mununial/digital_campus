<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Reporting Dashboard - BEC SRMS</title>
    <link rel="icon" type="image/png" href="../assets/images/bec_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <style>
        * {
            box-sizing: border-box;
        }
        /* Stepper UI */
        .stepper-header {
            background-color: white;
            padding: var(--space-4) 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--space-4);
            width: 100%;
        }
        .stepper-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            padding: 0 16px;
        }
        .stepper-line {
            position: absolute;
            top: 50%;
            left: 16px;
            right: 16px;
            height: 2px;
            background-color: var(--border-color);
            z-index: 1;
            transform: translateY(-50%);
        }
        .stepper-progress {
            position: absolute;
            top: 50%;
            left: 16px;
            height: 2px;
            background-color: var(--primary-blue);
            z-index: 1;
            transform: translateY(-50%);
            transition: width 0.3s ease;
            width: 0%;
        }
        .step {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            padding: 0 8px;
            cursor: pointer;
        }
        .step-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .step-label {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
        }
        .step.active .step-circle {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .step.active .step-label {
            color: var(--primary-blue);
            font-weight: 600;
        }
        .step.completed .step-circle {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            color: white;
        }

        /* Step Content */
        .step-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .step-content.active {
            display: block;
            opacity: 1;
        }

        .form-section {
            margin-bottom: var(--space-5);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-4);
        }
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-4) 0;
            margin-top: var(--space-5);
            border-top: 1px solid var(--border-color);
            gap: 12px;
            width: 100%;
        }
        .actions-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .facility-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            margin-bottom: var(--space-4);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .stepper-header {
                padding: 12px 0;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .stepper-container {
                min-width: 480px;
            }
        }
        @media (max-width: 600px) {
            .actions-bar {
                flex-direction: column-reverse;
                align-items: stretch;
                gap: 12px;
                width: 100%;
            }
            .actions-bar > div, .actions-right {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }
            .actions-bar .btn, 
            .actions-bar > div > .btn, 
            .actions-right > .btn {
                width: 100% !important;
                margin: 0 !important;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 44px;
            }
            .step-circle {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            .step-label {
                font-size: 0.68rem;
            }
        }
    </style>
    <script src="../js/utils/errorHandler.js"></script>
</head>
<body>
    <div id="app">
        <header id="header-container"></header>
        
        <div class="stepper-header">
            <div class="container stepper-container">
                <div class="stepper-line"></div>
                <div class="stepper-progress" id="stepper-progress"></div>
                
                <div class="step active" id="step-nav-reporting">
                    <div class="step-circle">1</div>
                    <div class="step-label">Master Info</div>
                </div>
                <div class="step" id="step-nav-documents">
                    <div class="step-circle">2</div>
                    <div class="step-label">Documents</div>
                </div>
                <div class="step" id="step-nav-facilities">
                    <div class="step-circle">3</div>
                    <div class="step-label">Facilities</div>
                </div>
                <div class="step" id="step-nav-hostel" style="display:none;">
                    <div class="step-circle">4</div>
                    <div class="step-label">Hostel</div>
                </div>
                <div class="step" id="step-nav-transport" style="display:none;">
                    <div class="step-circle">5</div>
                    <div class="step-label">Transport</div>
                </div>
                <div class="step" id="step-nav-antiragging">
                    <div class="step-circle">6</div>
                    <div class="step-label">Anti-Ragging</div>
                </div>
            </div>
        </div>
        
        <main id="main-content" class="container">
            
            <!-- STEP 1: MASTER INFORMATION & FEES -->
            <div id="step-reporting" class="step-content active">
                <form id="reporting-form" novalidate>
                    <div class="form-section" id="card-reporting-info"></div>
                    <div class="form-section" id="card-student-info"></div>
                    <div class="form-section" id="card-fee-details"></div>

                    <div class="actions-bar">
                        <button type="button" class="btn" disabled style="background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed;">Back</button>
                        <div>
                            <button type="button" class="btn" style="background-color: var(--background); color: var(--text-color); border: 1px solid var(--border-color); margin-right: var(--space-2);" id="save-draft-btn">Save Draft</button>
                            <button type="submit" class="btn btn-primary" id="next-btn">Next: Documents</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- STEP 2: DOCUMENTS -->
            <div id="step-documents" class="step-content">
                <div class="form-section" id="card-docs-student-details"></div>
                <div class="card" style="margin-bottom: var(--space-4);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3);">
                        <h3 style="margin-bottom: 0;">Document Upload Progress</h3>
                        <h3 id="upload-progress-text" style="margin-bottom: 0;">0 / 0 Documents Uploaded</h3>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="upload-progress-fill"></div>
                    </div>
                </div>
                <form id="documents-form" novalidate>
                    <div class="form-section" id="card-docs-checklist"></div>
                    <div class="actions-bar">
                        <button type="button" class="btn btn-secondary stepper-back-btn" data-back="reporting">Back</button>
                        <div>
                            <button type="button" class="btn" style="background-color: var(--background); color: var(--text-color); border: 1px solid var(--border-color); margin-right: var(--space-2);" id="docs-save-draft-btn">Save Draft</button>
                            <button type="submit" class="btn btn-primary" id="docs-next-btn">Next: Facility Selection</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- STEP 3: FACILITY SELECTION -->
            <div id="step-facilities" class="step-content">
                <form id="facilities-form" novalidate>
                    <div class="facility-card">
                        <h3 style="color: var(--primary-blue); margin-bottom: var(--space-2);">Additional Facility Requirements</h3>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: var(--space-4);">Please select if you require College Hostel accommodation or Transport facility during your study at BEC.</p>
                        
                        <div style="display: flex; flex-direction: column; gap: var(--space-4);">
                            <div style="padding: var(--space-3); border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: #f8fafc;">
                                <label style="font-weight: 600; display: block; margin-bottom: var(--space-2);">1. Do you require Hostel Accommodation?</label>
                                <div style="display: flex; gap: var(--space-4);">
                                    <label style="cursor: pointer;"><input type="radio" name="facilityHostel" value="Yes"> Yes, I require Hostel</label>
                                    <label style="cursor: pointer;"><input type="radio" name="facilityHostel" value="No" checked> No, Day Scholar</label>
                                </div>
                            </div>

                            <div style="padding: var(--space-3); border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: #f8fafc;">
                                <label style="font-weight: 600; display: block; margin-bottom: var(--space-2);">2. Do you require College Bus Transport?</label>
                                <div style="display: flex; gap: var(--space-4);">
                                    <label style="cursor: pointer;"><input type="radio" name="facilityTransport" value="Yes"> Yes, I require Bus Transport</label>
                                    <label style="cursor: pointer;"><input type="radio" name="facilityTransport" value="No" checked> No, Self Transport</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="actions-bar">
                        <button type="button" class="btn btn-secondary stepper-back-btn" data-back="documents">Back</button>
                        <div>
                            <button type="submit" class="btn btn-primary" id="facilities-next-btn">Continue</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- STEP 4: CONDITIONAL HOSTEL -->
            <div id="step-hostel" class="step-content">
                <form id="hostel-form" novalidate>
                    <div class="form-section" id="card-hostel-prefilled-info"></div>
                    <div class="form-section" id="card-hostel-requirements"></div>
                    <div class="actions-bar">
                        <button type="button" class="btn btn-secondary stepper-back-btn" data-back="facilities">Back</button>
                        <div>
                            <button type="submit" class="btn btn-primary" id="hostel-next-btn">Continue</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- STEP 5: CONDITIONAL TRANSPORT -->
            <div id="step-transport" class="step-content">
                <form id="transport-form" novalidate>
                    <div class="form-section" id="card-transport-prefilled-info"></div>
                    <div class="form-section" id="card-transport-requirements"></div>
                    <div class="actions-bar">
                        <button type="button" class="btn btn-secondary stepper-back-btn" data-back="facilities">Back</button>
                        <div>
                            <button type="submit" class="btn btn-primary" id="transport-next-btn">Continue</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- STEP 6: ANTI-RAGGING -->
            <div id="step-antiragging" class="step-content">
                <form id="antiragging-form" novalidate>
                    <div class="form-section" id="card-ar-student-info"></div>
                    <div class="form-section" id="card-ar-declaration"></div>
                    <div class="form-section" id="card-ar-additional-info"></div>
                    <div class="actions-bar">
                        <button type="button" class="btn btn-secondary stepper-back-btn" id="ar-back-btn" data-back="facilities">Back</button>
                        <div>
                            <button type="submit" class="btn btn-primary" id="ar-next-btn">Review Application</button>
                        </div>
                    </div>
                </form>
            </div>
            
        </main>
        
        <footer id="footer-container"></footer>
    </div>

    <script type="module" src="../js/main.js?v=1.1.5&t=1785257"></script>
    <script type="module" src="../js/dashboard.js?v=1.1.5&t=1785257"></script>
    <script type="module" src="../js/reporting.js?v=1.1.5&t=1785257"></script>
    <script type="module" src="../js/hostel.js?v=1.1.5&t=1785257"></script>
    <script type="module" src="../js/transport.js?v=1.1.5&t=1785257"></script>
    <script type="module" src="../js/antiragging.js?v=1.1.5&t=1785257"></script>
    <script type="module" src="../js/documents.js?v=1.1.5&t=1785257"></script>

</body>
</html>
